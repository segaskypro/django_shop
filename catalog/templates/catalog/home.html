{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}

{% block content %}
    <h1>Список товаров</h1>

    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>
            <p><strong>Цена:</strong> {{ product.price }} руб.</p>
            <p>{{ product.description }}</p>
            <a href="{% url 'product_detail' product.id %}">Подробнее →</a>
        </div>
        <hr>
    {% endfor %}
{% endblock %}
