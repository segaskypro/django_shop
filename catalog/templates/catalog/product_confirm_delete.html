{% extends 'base.html' %}

{% block title %}Удалить продукт{% endblock %}

{% block content %}
    <h1>Удалить продукт "{{ product.name }}"?</h1>
    <p>Вы уверены, что хотите удалить этот продукт? Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px 20px; border: none; cursor: pointer;">Да, удалить</button>
        <a href="{% url 'catalog:home' %}" style="margin-left: 10px;">Отмена</a>
    </form>
{% endblock %}
